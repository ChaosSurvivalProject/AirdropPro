name: AirdropPro
version: 1.0.0
main: com.yuanbao.airdrop.AirdropPlugin
api-version: 1.21
author: Yuanbao
description: 每日两次定时三种随机空投（普通 / 精良 / 传奇）
website: https://yuanbao.tencent.com

commands:
  airdrop:
    description: 空投管理命令
    usage: /airdrop <reload|drop|next|info>
    permission: airdrop.admin
    permission-message: "§c你没有权限使用此命令。"
    aliases:
      - ad
      - kongtou

  adupdate:
    description: AirdropPro 内置更新管理命令
    usage: /<command> <check|apply|status>
    permission: airdrop.update

permissions:
  airdrop.admin:
    description: 允许使用空投管理命令
    default: op

  airdrop.update:
    description: 检查并应用 AirdropPro 内置更新（管理员）
    default: op
